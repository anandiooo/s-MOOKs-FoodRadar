; MOOKS V1 firmware
;
; STATUS: written but NOT COMPILED. There is no ESP32 toolchain in the environment
; this was authored in, so treat every file here as a reviewed design under test,
; not as known-good code. The first thing you should do is `pio run` and fix what
; falls out. The architecture is the deliverable; the syntax is cheap to repair.
;
; Library versions are PINNED. An unpinned u8g2 or ArduinoJson major bump will
; silently change behaviour weeks later, which is the worst possible time.

[platformio]
default_envs = device

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Native USB CDC for logging — the C3 has no USB-serial chip to keep awake,
    ; which is part of why its sleep current is respectable.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.1.0

[env:device]
build_flags =
    ${env.build_flags}
    -DMOOKS_LOG_LEVEL=2

; Same firmware, verbose logging, no deep sleep. Use this on the bench so the
; device does not vanish mid-debug.
[env:bench]
build_flags =
    ${env.build_flags}
    -DMOOKS_LOG_LEVEL=4
    -DMOOKS_DISABLE_DEEP_SLEEP=1
    -DMOOKS_FAKE_CONTENT=1

; Host-side unit tests for the pure logic (ranking, parsing, the button FSM).
; No hardware required, runs in CI. This is the cheap half of the test plan.
[env:native]
platform = native
build_flags = -std=gnu++17 -DMOOKS_NATIVE=1
test_framework = unity
